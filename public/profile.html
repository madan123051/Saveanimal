<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - SaveAnimal Nepal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.2.0/dist/full.min.css" rel="stylesheet" type="text/css" />
</head>
<body class="bg-gradient-to-br from-green-50 to-blue-50">

  <!-- PROFILE MODAL (ONLY FOR VISITORS) -->
  <dialog id="profileModal" class="modal">
    <div class="modal-box w-full max-w-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-2xl text-green-700">My Profile</h3>
        <button onclick="handleLogout()" class="btn btn-sm btn-ghost">✕</button>
      </div>

      <!-- ROLE BADGE -->
      <div class="mb-6">
        <span id="userRole" class="badge badge-lg badge-info">Visitor</span>
      </div>

      <!-- PROFILE INFO -->
      <div class="space-y-4">
        <!-- Name -->
        <div class="form-control">
          <label class="label">
            <span class="label-text font-semibold">Full Name</span>
          </label>
          <input type="text" id="profileName" placeholder="Visitor" class="input input-bordered" readonly>
        </div>

        <!-- Email -->
        <div class="form-control">
          <label class="label">
            <span class="label-text font-semibold">Email</span>
          </label>
          <input type="email" id="profileEmail" placeholder="visitor@saveanimal.com" class="input input-bordered" readonly>
        </div>

        <!-- VISITOR MESSAGE -->
        <div id="visitorMessage" class="alert alert-info mt-6">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-current shrink-0 w-6 h-6"><path stroke-linecap="round" stroke-linejoin="miter" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span>You're viewing as a Visitor. Sign up as a volunteer to unlock more features! 🐾</span>
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="modal-action mt-6">
        <button onclick="window.location.href='/public/index.html'" class="btn btn-primary">Back to Home</button>
        <button onclick="handleLogout()" class="btn btn-outline">Logout</button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop">
      <button></button>
    </form>
  </dialog>

  <!-- REDIRECT MESSAGE (for admin/volunteer) -->
  <div id="redirectMessage" style="display: none;" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-400 to-blue-500">
    <div class="card bg-white shadow-2xl max-w-md">
      <div class="card-body text-center">
        <h2 class="card-title justify-center text-2xl">Welcome Back! 👋</h2>
        <p class="text-gray-600">Redirecting to your dashboard...</p>
        <div class="loading loading-spinner loading-lg mx-auto mt-4"></div>
        <p class="text-sm text-gray-500 mt-4">If not redirected automatically, <a href="/dashboard/index.html" class="link link-primary">click here</a></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    // Profile page initialization
    document.addEventListener('DOMContentLoaded', () => {
      const user = JSON.parse(localStorage.getItem('saveanimal_user'));
      
      if (!user) {
        // No user logged in - show home
        window.location.href = '/public/index.html';
        return;
      }

      // User is admin or volunteer - redirect to dashboard
      if (user.role === 'admin' || user.role === 'volunteer') {
        document.getElementById('redirectMessage').style.display = 'flex';
        setTimeout(() => {
          window.location.href = '/dashboard/index.html';
        }, 2000);
        return;
      }

      // User is visitor - show profile modal
      if (user.role === 'visitor') {
        updateVisitorProfile(user);
        document.getElementById('profileModal').showModal();
      }
    });

    // Update visitor profile display
    function updateVisitorProfile(user) {
      document.getElementById('profileName').value = user.name || 'Visitor';
      document.getElementById('profileEmail').value = user.email || 'visitor@saveanimal.com';
      document.getElementById('userRole').textContent = user.role.charAt(0).toUpperCase() + user.role.slice(1);
      document.getElementById('userRole').className = 'badge badge-lg badge-info';
    }
  </script>
</body>
</html>

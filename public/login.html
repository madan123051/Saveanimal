<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – SaveAnimal Nepal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:linear-gradient(135deg,#0f4c1f 0%,#1a6b3a 50%,#0d3819 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;padding:16px}
    .card{width:100%;max-width:440px;background:rgba(255,255,255,.97);border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,.35);padding:44px 40px 36px}
    .logo{text-align:center;margin-bottom:28px}
    .logo h1{font-family:'Poppins',sans-serif;font-size:30px;font-weight:800;color:#0f4c1f}
    .logo p{color:#666;font-size:13px;margin-top:4px}
    .tabs{display:flex;background:#f0f0f0;border-radius:10px;padding:4px;margin-bottom:24px}
    .tab{flex:1;padding:9px;border:none;background:transparent;border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;color:#888;transition:all .2s}
    .tab.active{background:white;color:#0f4c1f;box-shadow:0 2px 8px rgba(0,0,0,.12)}
    .panel{display:none}.panel.active{display:block}
    .field{margin-bottom:18px}
    .field label{display:block;font-size:13px;font-weight:600;color:#333;margin-bottom:6px}
    .field input{width:100%;padding:11px 14px;border:2px solid #e2e8f0;border-radius:9px;font-size:14px;font-family:'Inter',sans-serif;transition:border-color .2s,box-shadow .2s}
    .field input:focus{outline:none;border-color:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.12)}
    .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:18px}
    .row a{color:#16a34a;text-decoration:none;font-weight:600}
    .btn-main{width:100%;padding:13px;background:linear-gradient(135deg,#0f4c1f,#16a34a);color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity .2s,transform .15s}
    .btn-main:hover{opacity:.92;transform:translateY(-1px)}.btn-main:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#aaa;font-size:13px}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:#e2e8f0}
    .btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;border:2px solid #e2e8f0;border-radius:10px;background:white;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:border-color .2s,background .2s}
    .btn-google:hover{border-color:#4285f4;background:#f8f9ff}
    .status{margin-top:14px;padding:10px 14px;border-radius:9px;font-size:13px;display:none;text-align:center}
    .status.ok{display:block;background:#dcfce7;color:#15803d}
    .status.err{display:block;background:#fee2e2;color:#b91c1c}
    .legend{background:#f8fafc;border-radius:12px;padding:14px 16px;margin-top:22px}
    .legend-title{font-size:12px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
    .legend-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:12px;color:#555}
    .badge{padding:2px 8px;border-radius:20px;font-weight:700;font-size:11px}
    .badge-admin{background:#fef3c7;color:#92400e}
    .badge-vol{background:#dcfce7;color:#15803d}
    .badge-user{background:#e0f2fe;color:#0369a1}
    .signup-link{text-align:center;font-size:13px;color:#888;margin-top:18px}
    .signup-link a{color:#0f4c1f;font-weight:600;text-decoration:none}
    @media(max-width:480px){.card{padding:28px 20px 24px}}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>🐾 SaveAnimal</h1>
    <p>Nepal Animal Rescue Platform</p>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">Sign In</button>
    <button class="tab" onclick="switchTab('register')">Register</button>
  </div>
  <!-- SIGN IN -->
  <div id="panel-login" class="panel active">
    <div class="field"><label>Email</label><input type="email" id="li-email" placeholder="you@example.com" /></div>
    <div class="field"><label>Password</label><input type="password" id="li-pass" placeholder="••••••••" /></div>
    <div class="row">
      <label style="display:flex;align-items:center;gap:6px;color:#555;"><input type="checkbox" id="li-remember"> Remember me</label>
      <a href="#" onclick="forgotPassword();return false;">Forgot password?</a>
    </div>
    <button class="btn-main" id="li-btn" onclick="emailLogin()">Sign In</button>
    <div class="divider">or continue with</div>
    <button class="btn-google" onclick="googleLogin()">
      <img src="https://www.google.com/favicon.ico" width="20" height="20" alt="G"> Continue with Google
    </button>
    <div id="li-status" class="status"></div>
    <div class="signup-link">No account? <a href="#" onclick="switchTab('register');return false;">Register here</a></div>
  </div>
  <!-- REGISTER -->
  <div id="panel-register" class="panel">
    <div class="field"><label>Full Name</label><input type="text" id="reg-name" placeholder="Aarav Sharma" /></div>
    <div class="field"><label>Email</label><input type="email" id="reg-email" placeholder="you@example.com" /></div>
    <div class="field"><label>Password <small style="color:#aaa;font-weight:400">(min 6 chars)</small></label><input type="password" id="reg-pass" placeholder="••••••••" /></div>
    <button class="btn-main" id="reg-btn" onclick="emailRegister()">Create Account</button>
    <div class="divider">or</div>
    <button class="btn-google" onclick="googleLogin()">
      <img src="https://www.google.com/favicon.ico" width="20" height="20" alt="G"> Register with Google
    </button>
    <div id="reg-status" class="status"></div>
    <div class="signup-link">Have account? <a href="#" onclick="switchTab('login');return false;">Sign in</a></div>
  </div>
  <!-- Role legend -->
  <div class="legend">
    <div class="legend-title">Role Guide</div>
    <div class="legend-row"><span class="badge badge-admin">Admin</span> Full access – manage volunteers, reports, roles</div>
    <div class="legend-row"><span class="badge badge-vol">Volunteer</span> View tasks, log hours, join activities</div>
    <div class="legend-row"><span class="badge badge-user">User</span> Browse events &amp; info (default on signup)</div>
  </div>
</div>
<script>
// ── ADMIN & AUTH-FLAG ─────────────────────────────────────────────────────────
var ADMIN_EMAIL = 'madan123050@gmail.com';        // always gets admin role on every login
// Prevents onAuthStateChanged from firing a duplicate redirect while a manual
// login/register flow is already in progress.
var isHandlingAuth = false;

// ── FIREBASE CONFIG ──────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey:            "AIzaSyCXDJrFmn-pzbqys91tj4Fruqn4tl58p9Y",
  authDomain:        "wildsaura-1ef8a.firebaseapp.com",
  databaseURL:       "https://wildsaura-1ef8a-default-rtdb.firebaseio.com",
  projectId:         "wildsaura-1ef8a",
  storageBucket:     "wildsaura-1ef8a.firebasestorage.app",
  messagingSenderId: "690017200836",
  appId:             "1:690017200836:web:a3c519752907c3f66ff791"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const rtdb = firebase.database();

function setStatus(id, msg, type) {
  var el = document.getElementById(id+'-status');
  el.textContent = msg; el.className = 'status '+type;
}
function setLoading(id, v) { document.getElementById(id).disabled = v; }
function switchTab(t) {
  ['login','register'].forEach(function(n){
    document.getElementById('panel-'+n).classList.toggle('active', n===t);
  });
  document.querySelectorAll('.tab').forEach(function(b,i){
    b.classList.toggle('active', (i===0 && t==='login') || (i===1 && t==='register'));
  });
}

async function getRoleFromDB(uid) {
  var snap = await rtdb.ref('userRoles/'+uid).once('value');
  return snap.val() || 'user';
}
async function ensureRole(uid, def) {
  var snap = await rtdb.ref('userRoles/'+uid).once('value');
  if (!snap.exists()) await rtdb.ref('userRoles/'+uid).set(def);
  return snap.val() || def;
}
async function handleAuthSuccess(user, statusId) {
  setStatus(statusId, 'Logged in! Fetching role…', 'ok');
  // Ensure admin email always has the admin role
  if (user.email === ADMIN_EMAIL) {
    await rtdb.ref('userRoles/' + user.uid).set('admin');
  }
  var role = await getRoleFromDB(user.uid);
  var data = {
    id: user.uid,
    name: user.displayName || user.email.split('@')[0],
    email: user.email,
    photo: user.photoURL || null,
    role: role,
    loginTime: new Date().toISOString()
  };
  localStorage.setItem('saveanimal_user', JSON.stringify(data));
  localStorage.setItem('saveanimal_currentUser', JSON.stringify(data));
  setStatus(statusId, '✓ Welcome '+data.name+'! Redirecting…', 'ok');
  setTimeout(function(){ window.location.href='/dashboard/'; }, 900);
}

async function emailLogin() {
  var email = document.getElementById('li-email').value.trim();
  var pass  = document.getElementById('li-pass').value;
  if (!email||!pass){ setStatus('li','Enter email and password.','err'); return; }
  setLoading('li-btn', true);
  isHandlingAuth = true;
  try {
    var c = await auth.signInWithEmailAndPassword(email, pass);
    await handleAuthSuccess(c.user, 'li');
  } catch(e){ isHandlingAuth = false; setStatus('li', friendlyError(e), 'err'); setLoading('li-btn',false); }
}
async function emailRegister() {
  var name  = document.getElementById('reg-name').value.trim();
  var email = document.getElementById('reg-email').value.trim();
  var pass  = document.getElementById('reg-pass').value;
  if (!name||!email||!pass){ setStatus('reg','Fill all fields.','err'); return; }
  if (pass.length<6){ setStatus('reg','Password: min 6 chars.','err'); return; }
  setLoading('reg-btn', true);
  isHandlingAuth = true;
  try {
    var c = await auth.createUserWithEmailAndPassword(email, pass);
    await c.user.updateProfile({ displayName: name });
    await ensureRole(c.user.uid, 'user');
    await handleAuthSuccess(c.user, 'reg');
  } catch(e){ isHandlingAuth = false; setStatus('reg', friendlyError(e), 'err'); setLoading('reg-btn',false); }
}
async function googleLogin() {
  var sid = document.getElementById('panel-login').classList.contains('active') ? 'li' : 'reg';
  isHandlingAuth = true;
  try {
    var c = await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    // Admin email always gets admin role; everyone else gets user (if not set yet)
    if (c.user.email === ADMIN_EMAIL) {
      await rtdb.ref('userRoles/' + c.user.uid).set('admin');
    } else {
      await ensureRole(c.user.uid, 'user');
    }
    await handleAuthSuccess(c.user, sid);
  } catch(e){ isHandlingAuth = false; setStatus(sid, friendlyError(e), 'err'); }
}
async function forgotPassword() {
  var email = document.getElementById('li-email').value.trim();
  if (!email){ setStatus('li','Enter your email first.','err'); return; }
  try {
    await auth.sendPasswordResetEmail(email);
    setStatus('li','📧 Reset link sent to '+email, 'ok');
  } catch(e){ setStatus('li', friendlyError(e), 'err'); }
}
function friendlyError(e) {
  var m = {
    'auth/user-not-found':'No account found with that email.',
    'auth/wrong-password':'Incorrect password.',
    'auth/email-already-in-use':'Email already registered.',
    'auth/invalid-email':'Invalid email address.',
    'auth/weak-password':'Password too weak (min 6 chars).',
    'auth/popup-closed-by-user':'Google sign-in cancelled.',
    'auth/network-request-failed':'Network error.',
    'auth/invalid-api-key':'⚠️ Firebase API key missing — see login.html comments.',
  };
  return m[e.code] || e.message;
}
document.addEventListener('keydown', function(e){
  if (e.key==='Enter'){
    if (document.getElementById('panel-login').classList.contains('active')) emailLogin();
    else emailRegister();
  }
});
auth.onAuthStateChanged(async function(user){
  if (user && !isHandlingAuth) {
    var role = await getRoleFromDB(user.uid);
    var data = { id:user.uid, name:user.displayName||user.email.split('@')[0],
                 email:user.email, photo:user.photoURL||null, role:role,
                 loginTime:new Date().toISOString() };
    localStorage.setItem('saveanimal_user', JSON.stringify(data));
    localStorage.setItem('saveanimal_currentUser', JSON.stringify(data));
    window.location.href='/dashboard/';
  }
});
</script>
</body>
</html>
